spring:
  application:
    name: Online Bookstore Internship Project
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:0000}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

jwt:
  # Base64-encoded HMAC-SHA256 key. The default only exists so the app still
  # runs locally out of the box — set JWT_SECRET to a real key in any deployed
  # environment, or every token this app issues is forgeable.
  secret: ${JWT_SECRET:a1ce7f529dd9aaa2e6d9004b2081c3c6cfd9bae708a9cae71de6346a0ecc5f2e}

jwt_cookie:
  value:
    staff_time: 86400000
