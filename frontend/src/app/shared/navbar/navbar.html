<nav class="navbar">
  <div class="navbar-inner">
    <a class="wordmark" [routerLink]="isAuthenticated() ? '/home' : '/'">BOOK STORE</a>

    <div class="navbar-actions">
      <app-theme-toggle />

      @if (isAuthenticated()) {
        @if (isAdmin()) {
          <a class="admin-link" routerLink="/admin/books">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
                 stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2 4 6v6c0 4.4 3.4 8.5 8 10 4.6-1.5 8-5.6 8-10V6l-8-4z" />
            </svg>
            Admin
          </a>
        }
        <span class="greeting">Welcome, <strong>{{ displayName() }}</strong></span>
        <button type="button" class="btn-ghost" (click)="logout()">Log out</button>
      } @else {
        <a class="signin-link" routerLink="/login">Sign in</a>
        <a class="btn-solid" routerLink="/signup">Sign up</a>
      }
    </div>
  </div>
</nav>
