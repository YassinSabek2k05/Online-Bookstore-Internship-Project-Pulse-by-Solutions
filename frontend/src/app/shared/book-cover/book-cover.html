@if (imageSrc(); as src) {
  <img class="cover cover-image" [src]="src" [alt]="'Cover of ' + book().title" />
} @else {
  <div class="cover cover-fallback" [style.background]="fallbackColor()">
    <span class="cover-title">{{ book().title }}</span>
    <span class="cover-author">{{ book().author }}</span>
  </div>
}
